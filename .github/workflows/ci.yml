name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app is developed on Windows. ONNX Runtime (semantic search) needs MSVC 14.40 or later
    # (README), which the Visual Studio on windows-latest has.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The docs check diffs against the pushed range's or the PR's base commit.
          fetch-depth: 0

      # Node and Rust at the versions in mise.toml; every command below runs through `mise exec`.
      - uses: jdx/mise-action@v5

      - name: Rust components
        run: mise exec -- rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: npm cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: mise exec -- npm ci

      - name: Build overlay
        run: mise exec -- npm run build:overlay

      - name: rustfmt
        run: mise exec -- cargo fmt --all --check

      - name: clippy
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings

      - name: TypeScript bindings match the Rust types
        run: mise exec -- node scripts/bindings.mjs --check

      - name: Rust tests
        run: mise exec -- cargo test --workspace

      - name: Frontend tests
        run: mise exec -- npm test

      - name: Frontend lint, formatting and React Compiler
        run: mise exec -- npm run lint

      - name: English and Japanese docs change together
        run: mise exec -- node scripts/doc-pairs.mjs ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Typecheck and build
        run: mise exec -- npm run build

      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: mise exec -- npx playwright install chromium

      - name: E2E
        run: mise exec -- npm run e2e

      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
