# Checks a release's files as uploaded and starts them on a clean runner. It runs after every release build, and by hand
# to recheck a tag without rebuilding. It changes nothing on the release. See docs/release.md.
name: Release check

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.3.0
        type: string
        required: true

permissions:
  # Only a token that can write sees a draft release.
  contents: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # verify-release.ts reads the public key at this tag and at the one before it.
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Check the uploaded files
        shell: pwsh
        run: |
          gh release download $env:TAG --dir release
          if ($LASTEXITCODE -ne 0) { throw "Could not download the files of $env:TAG" }
          Expand-Archive "release/Lattice_$($env:TAG.Substring(1))_x64-portable.zip" release
          mise exec -- node scripts/verify-release.ts $env:TAG release

      - name: Start the portable copy, then the installed one, and uninstall
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes

          # Elements with a name on screen, read through UI Automation. The packaged app takes no WebView2 debug port.
          function Get-NamedCount($window) {
            $root = [Windows.Automation.AutomationElement]::FromHandle($window)
            $all = $root.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition)
            @($all | Where-Object { $_.Current.Name }).Count
          }

          function Test-App($exe, $db) {
            $app = Start-Process $exe -PassThru
            # A white window keeps its process and has only its title and the web content's own name, so require more.
            $named = 0
            foreach ($try in 1..24) {
              Start-Sleep -Seconds 5
              $app.Refresh()
              if ($app.HasExited) { throw "$exe exited with $($app.ExitCode)" }
              if ($app.MainWindowHandle -eq 0) { continue }
              # The page may redraw during a read.
              try { $named = Get-NamedCount $app.MainWindowHandle } catch { continue }
              if ($named -gt 10) { break }
            }
            if ($named -le 10) { throw "$exe did not render: $named named elements on screen" }
            "$exe rendered $named named elements"
            if (-not (Test-Path $db)) { throw "$exe did not create $db" }
            & (Join-Path (Split-Path $exe) 'lattice-cli.exe') list
            if ($LASTEXITCODE -ne 0) { throw "The CLI beside $exe could not read $db" }
            Stop-Process -Id $app.Id -Force
            $app.WaitForExit()
          }

          $version = $env:TAG.Substring(1)
          $portable = (Resolve-Path "release/Lattice_${version}_x64-portable").Path
          $installed = "$env:LOCALAPPDATA\Lattice"
          $db = "$env:APPDATA\Lattice\lattice.db"

          # First, while no default library exists, so the portable CLI can only be reading its own.
          Test-App "$portable\Lattice.exe" "$portable\data\lattice.db"
          if (Test-Path $db) { throw "The portable copy wrote to $db" }

          $setup = Start-Process "release\Lattice_${version}_x64-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer exited with $($setup.ExitCode)" }
          Test-App "$installed\lattice.exe" $db

          Start-Process "$installed\uninstall.exe" -ArgumentList '/S' -Wait
          foreach ($exe in 'lattice.exe', 'lattice-cli.exe') {
            if (Test-Path "$installed\$exe") { throw "Uninstalling left $exe" }
          }
          if (-not (Test-Path $db)) { throw "Uninstalling removed the library" }
          "Portable copy, install, start, CLI and uninstall checked"

      - name: Save what the app left
        if: failure()
        shell: pwsh
        run: |
          Get-Process lattice, msedgewebview2 -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
          Get-ChildItem "release/*/data/logs/*", "$env:LOCALAPPDATA/Lattice/logs/*" -File -ErrorAction SilentlyContinue | ForEach-Object {
            "== $_"
            Get-Content $_ -Tail 40
          }
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $screen = [Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
          [Drawing.Graphics]::FromImage($screen).CopyFromScreen(0, 0, 0, 0, $screen.Size)
          $screen.Save("$PWD\screen.png")

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-check-screen
          path: screen.png
