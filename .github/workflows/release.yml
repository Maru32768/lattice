# Builds a draft GitHub release for a `v*` tag: the NSIS installer, a portable zip (with lattice-cli), the
# third-party license list and signed updater artifacts
# (the installer's .sig and latest.json). See docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v5

      - name: Require CI success for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read CI status" }
          $latest = $runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA } | Sort-Object run_number -Descending | Select-Object -First 1
          if (-not $latest -or $latest.status -ne 'completed' -or $latest.conclusion -ne 'success') {
            throw "CI must pass on $env:GITHUB_SHA before releasing. Wait for CI, then rerun this release workflow."
          }

      - name: Install npm packages
        run: mise exec -- npm ci

      - name: Check version, release notes and signing prerequisites
        id: notes
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: mise exec -- node scripts/release.mjs "${{ github.ref_name }}"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        run: mise exec -- cargo install --locked cargo-about --features cli

      - name: Regenerate the third-party license list
        run: mise run licenses

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lattice ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --config src-tauri/tauri.updater.conf.json

      - name: Build the CLI
        run: mise exec -- cargo build --release -p lattice-cli

      - name: Portable zip and license list
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $name = "Lattice_${version}_x64-portable"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/lattice.exe "$name/Lattice.exe"
          Copy-Item target/release/lattice-cli.exe "$name/lattice-cli.exe"
          # The marker that keeps all data in a `data` folder next to the exe.
          New-Item -ItemType File "$name/portable" | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          gh release upload "${{ github.ref_name }}" "$name.zip" THIRD_PARTY_LICENSES --clobber
