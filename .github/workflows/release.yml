# Builds a draft GitHub release for a `v*` tag: the NSIS installer, a portable zip (with lattice-cli), the
# third-party license list and, when the signing key secret is set, the updater artifacts
# (the installer's .sig and latest.json). See docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v5

      - name: Install npm packages
        run: npm ci

      - name: Check the tag against the app version
        run: node scripts/version.mjs --check "${{ github.ref_name }}"

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          notes=$(awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, "## [") == 1 { p = index($0, h) == 1; next } p' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          {
            echo 'body<<LATTICE_NOTES'
            echo "$notes"
            echo 'LATTICE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-about
        run: cargo install --locked cargo-about --features cli

      - name: Regenerate the third-party license list
        run: mise run licenses

      # Without the key, `createUpdaterArtifacts` would fail the build; the release then has no updater files.
      - name: Turn on updater artifacts when the signing key is set
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--config ${GITHUB_WORKSPACE//\\//}/src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: the release has no updater artifacts"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lattice ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ steps.updater.outputs.args }}

      - name: Build the CLI
        run: cargo build --release -p lattice-cli

      - name: Portable zip and license list
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $name = "Lattice_${version}_x64-portable"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/lattice.exe "$name/Lattice.exe"
          Copy-Item target/release/lattice-cli.exe "$name/lattice-cli.exe"
          # The marker that keeps all data in a `data` folder next to the exe.
          New-Item -ItemType File "$name/portable" | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          gh release upload "${{ github.ref_name }}" "$name.zip" THIRD_PARTY_LICENSES --clobber
