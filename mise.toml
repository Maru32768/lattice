[tools]
node = "26"
rust = "1.99.1"

[tasks.dev]
description = "Run the desktop app with hot reload"
run = "npm run tauri dev"

[tasks.lint]
description = "rustfmt, clippy and oxlint"
run = [
  "npm run build:overlay",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "npm run lint",
]

[tasks.test]
description = "Lint, Rust tests, frontend tests and typecheck"
depends = ["lint"]
run = ["node scripts/bindings.mjs --check", "cargo test --workspace", "npm test", "npm run build"]

[tasks.bindings]
description = "Regenerate src/bindings: the TypeScript types of the Rust IPC types (ts-rs)"
run = "node scripts/bindings.mjs"

[tasks.e2e]
description = "Browser tests of the frontend over a mock backend (Playwright, Chromium)"
run = "npm run e2e"

[tasks.licenses]
description = "Regenerate THIRD_PARTY_LICENSES (needs `cargo install --locked cargo-about --features cli`)"
run = [
  "node -e \"require('node:fs').mkdirSync('target', { recursive: true })\"",
  "cargo about generate --fail -c scripts/about.toml -o target/rust-licenses.txt scripts/about.hbs",
  "node scripts/licenses.mjs target/rust-licenses.txt",
]
