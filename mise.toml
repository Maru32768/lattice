[tools]
node = "24"
rust = "1.99.1"

[tasks.dev]
description = "Run the desktop app with hot reload"
run = "npm run tauri dev"

[tasks.test]
description = "Rust tests, frontend tests and typecheck"
run = ["npm run build:overlay", "cargo test --workspace", "npm test", "npm run build"]

[tasks.licenses]
description = "Regenerate THIRD_PARTY_LICENSES (needs `cargo install --locked cargo-about --features cli`)"
run = [
  "cargo about generate --fail -c scripts/about.toml -o target/rust-licenses.txt scripts/about.hbs",
  "node scripts/licenses.mjs target/rust-licenses.txt",
]
