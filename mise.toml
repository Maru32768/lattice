[tools]
node = "24"
rust = "1.99.1"

[tasks.dev]
description = "Run the desktop app with hot reload"
run = "npm run tauri dev"

[tasks.lint]
description = "rustfmt, clippy and oxlint"
run = [
  "npm run build:overlay",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "npm run lint",
]

[tasks.test]
description = "Lint, Rust tests, frontend tests and typecheck"
depends = ["lint"]
run = ["cargo test --workspace", "npm test", "npm run build"]

[tasks.e2e]
description = "Browser tests of the frontend over a mock backend (Playwright, Chromium)"
run = "npm run e2e"
