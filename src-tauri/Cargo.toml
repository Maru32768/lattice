[package]
name = "lattice"
version.workspace = true
description = "Programmable reading environment"
license = "MIT"
authors = ["Maru32768"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
tauri = { version = "2", features = ["unstable"] }
lattice-core = { path = "../crates/lattice-core" }
tokio = { version = "1.53.3", features = ["sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-log = "2"
log = "0.4.34"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
ts-rs = "12"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# The versions wry uses, so the WebView2 controller it hands out is the same type.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }


