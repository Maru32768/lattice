<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF</title>
    <style>
      html,
      body {
        margin: 0;
        background: #e6e4de;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: safe center;
        gap: 8px;
        padding: 8px;
      }
      .page {
        position: relative;
        flex: none;
        width: calc(min(100%, 1000px) * var(--zoom, 1));
        container-type: inline-size;
        background: #fff;
        box-shadow: 0 1px 3px rgba(30, 28, 24, 0.25);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .textLayer {
        position: absolute;
        inset: 0;
        overflow: clip;
        line-height: 1;
        text-size-adjust: none;
        transform-origin: 0 0;
      }
      .textLayer span,
      .textLayer br {
        position: absolute;
        color: transparent;
        white-space: pre;
        transform-origin: 0 0;
        cursor: text;
        --font-height: 0;
        --scale-x: 1;
        --rotate: 0deg;
        font-size: calc(var(--total-scale-factor) * var(--font-height));
        transform: rotate(var(--rotate)) scaleX(var(--scale-x));
      }
      .textLayer .markedContent {
        display: contents;
      }
      .textLayer ::selection {
        background: rgba(47, 93, 138, 0.3);
      }
      .region {
        position: absolute;
        overflow: hidden;
        box-sizing: border-box;
        color: transparent;
        pointer-events: none;
        user-select: none;
        font:
          calc(var(--size) * 100cqw * var(--fit, 1)) / 1.25 system-ui,
          "Segoe UI",
          "Yu Gothic UI",
          sans-serif;
      }
      .region:has(.lattice-sentence[data-shown="t"]) {
        color: #1c1c1e;
        background: #fff;
        pointer-events: auto;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="pages"></div>
    <script type="module" src="/assets/viewer.js"></script>
  </body>
</html>
