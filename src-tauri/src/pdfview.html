<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF</title>
    <style>
      html,
      body {
        margin: 0;
        background: #e6e4de;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: safe center;
        gap: 8px;
        padding: 8px;
      }
      .page {
        position: relative;
        flex: none;
        width: calc(min(100%, 1000px) * var(--zoom, 1));
        container-type: inline-size;
        background: #fff;
        box-shadow: 0 1px 3px rgba(30, 28, 24, 0.25);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .textLayer {
        position: absolute;
        inset: 0;
        overflow: clip;
        line-height: 1;
        text-size-adjust: none;
        transform-origin: 0 0;
        /* Each span is a layer of its own: with every page's text kept, a hit test took 5 ms on 25 pages. */
        content-visibility: auto;
      }
      .textLayer span,
      .textLayer br {
        position: absolute;
        color: transparent;
        white-space: pre;
        transform-origin: 0 0;
        cursor: text;
        --font-height: 0;
        --scale-x: 1;
        --rotate: 0deg;
        font-size: calc(var(--total-scale-factor) * var(--font-height));
        transform: rotate(var(--rotate)) scaleX(var(--scale-x));
      }
      .textLayer .markedContent {
        display: contents;
      }
      .textLayer ::selection {
        background: rgba(47, 93, 138, 0.3);
      }
      .links {
        position: absolute;
        z-index: 1;
        inset: 0;
        pointer-events: none;
      }
      .links a {
        position: absolute;
        pointer-events: auto;
      }
      .links a:hover {
        background: rgba(47, 93, 138, 0.12);
      }
      .has-outline #pages {
        margin-left: 32px;
      }
      .outline-open #pages {
        margin-left: 280px;
      }
      #outline-toggle {
        position: fixed;
        z-index: 3;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        border: 0;
        font-size: 15px;
        color: #45474c;
        background: transparent;
        cursor: pointer;
      }
      #outline-toggle:hover {
        background: rgba(30, 28, 24, 0.1);
      }
      nav {
        position: fixed;
        z-index: 2;
        display: none;
        box-sizing: border-box;
        top: 0;
        bottom: 0;
        left: 0;
        width: 272px;
        padding: 32px 4px 12px;
        overflow: auto;
        background: #f6f5f1;
        border-right: 1px solid #d2cfc6;
        font: 12.5px/1.45 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif;
      }
      .outline-open nav {
        display: block;
      }
      nav ul {
        margin: 0;
        padding: 0 0 0 12px;
        list-style: none;
      }
      nav > ul {
        padding: 0;
      }
      nav li {
        position: relative;
        padding-left: 16px;
      }
      nav button {
        border: 0;
        font: inherit;
        color: #2c2d30;
        background: transparent;
        cursor: pointer;
      }
      nav .item {
        display: block;
        width: 100%;
        padding: 3px 4px;
        border-radius: 3px;
        text-align: left;
      }
      nav .item:hover:enabled {
        background: rgba(30, 28, 24, 0.08);
      }
      nav .item:disabled {
        cursor: default;
      }
      nav .fold {
        position: absolute;
        left: 0;
        top: 2px;
        width: 16px;
        height: 20px;
        padding: 0;
      }
      nav .fold::before {
        content: "▸";
        display: inline-block;
      }
      nav .fold[aria-expanded="true"]::before {
        transform: rotate(90deg);
      }
      .page-act {
        display: none;
        position: absolute;
        /* Above a translated paragraph, which covers the links at 2. */
        z-index: 3;
        top: 6px;
        right: 6px;
        padding: 3px 8px;
        border: 1px solid #d2cfc6;
        border-radius: 4px;
        font: 12px/1.4 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif;
        color: #45474c;
        background: #f6f5f1;
        cursor: pointer;
      }
      [data-lattice-on] .page-act:not([data-action="none"]) {
        display: block;
      }
      /* Transparent rather than hidden: it stays reachable by keyboard, and focus brings it out. */
      .page-act[data-action="redo"] {
        opacity: 0;
      }
      .page:is(:hover, :focus-within) .page-act[data-action="redo"] {
        opacity: 1;
      }
      .page-act:hover:enabled {
        background: #e6e4de;
      }
      .page-act:disabled {
        cursor: default;
      }
      .print-page {
        display: none;
      }
      .preparing-print,
      .preparing-print * {
        cursor: progress !important;
      }
      #pdf-failed {
        font: 14px system-ui, "Segoe UI", "Yu Gothic UI", sans-serif;
        color: #5a5650;
      }
      @media print {
        #pages {
          padding: 0;
          gap: 0;
        }
        /* One page to a sheet, whatever their shapes: an A4 page at full width is taller than a Letter sheet. */
        .page {
          width: min(100%, calc(100vh * var(--aspect)));
          break-inside: avoid;
          box-shadow: none;
        }
        .page:not(:has(canvas)) .print-page {
          display: block;
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        nav,
        #outline-toggle,
        .page-act {
          display: none !important;
        }
        .has-outline #pages {
          margin-left: 0;
        }
      }
      .region {
        position: absolute;
        overflow: hidden;
        box-sizing: border-box;
        color: transparent;
        pointer-events: none;
        user-select: none;
        font:
          calc(var(--size) * 100cqw * var(--fit, 1)) / var(--leading, 1.5) system-ui,
          "Segoe UI",
          "Yu Gothic UI",
          sans-serif;
      }
      /* A formula looks as it does in the paper, whatever the type around it. */
      .region math {
        font-family: "Times New Roman", serif;
      }
      .region math i {
        font-style: italic;
      }
      /* Lines stay evenly spaced around a script. */
      .region sub,
      .region sup {
        line-height: 0;
      }
      /* A paragraph still showing the original takes the pointer too, for its sentences' tooltips. */
      [data-lattice-on] .region:is([data-lattice-block="done"], [data-lattice-block="translating"], [data-lattice-block="failed"]) {
        pointer-events: auto;
        user-select: text;
      }
      .region .lattice-sentence:hover {
        background: rgba(47, 93, 138, 0.12);
      }
      /* Above the links: a link's place on the page means nothing under text set anew. */
      .region:has(.lattice-sentence[data-shown="t"]) {
        z-index: 2;
        color: #1c1c1e;
        background: #fff;
        /* The original's glyphs stick out of its measured box by a hair. */
        box-shadow: 0 0 0 2px #fff;
      }
    </style>
  </head>
  <body>
    <div id="pages"></div>
    <script type="module" src="/assets/viewer.js"></script>
  </body>
</html>
