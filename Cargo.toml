[workspace]
resolver = "3"
members = ["crates/lattice-core", "crates/lattice-server", "crates/lattice-cli", "src-tauri"]
exclude = ["vendor/lopdf"]

# lopdf 0.42.0, the version pdf-extract 0.12.1 takes: its source as published, without the examples, and patched where
# "Lattice:" comments say. It resolved the /Length of a stream by recursion that a crafted PDF could keep going until the
# stack overflowed, which no `catch_unwind` stops. lopdf 0.46 ends a loop the same way, but follows a long chain as far
# as it goes. Drop this once pdf-extract takes a lopdf that ends both.
[patch.crates-io]
lopdf = { path = "vendor/lopdf" }

# The app version for both crates; `npm run bump -- <x.y.z>` keeps it in sync with package.json.
[workspace.package]
version = "0.3.0"

# Safety lints beyond clippy's defaults; CI denies warnings. Tests may unwrap, index and panic (clippy.toml).
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: pdf-extract panics on some malformed PDFs, and `pdf::read` catches that
# as an import error instead of losing the app.
panic = "unwind"
strip = true
