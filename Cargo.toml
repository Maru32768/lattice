[workspace]
resolver = "3"
members = ["crates/lattice-core", "crates/lattice-cli", "src-tauri"]

# The app version for both crates; `npm run bump -- <x.y.z>` keeps it in sync with package.json.
[workspace.package]
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: pdf-extract panics on some malformed PDFs, and `pdf::read` catches that
# as an import error instead of losing the app.
panic = "unwind"
strip = true
