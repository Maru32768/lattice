[package]
name = "lattice-server"
version.workspace = true
description = "Serves the library to a phone's browser"
license = "MIT"
authors = ["Maru32768"]
edition = "2024"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
lattice-core = { path = "../lattice-core" }
log = "0.4.34"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
