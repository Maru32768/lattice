[package]
name = "lattice-cli"
version.workspace = true
description = "Lattice from the command line, and as an MCP server for agents"
license = "MIT"
authors = ["Maru32768"]
edition = "2024"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
lattice-core = { path = "../lattice-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3.6"
