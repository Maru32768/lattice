[package]
name = "lattice-core"
version = "0.1.0"
edition = "2024"

[dependencies]
dom_query = "0.28.0"
dom_smoothie = "0.18.2"
encoding_rs = "0.8.42"
fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
feed-rs = "3.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
log = "0.4.34"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "gzip", "brotli", "deflate", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["process", "time", "sync", "io-util", "macros", "rt"] }
url = "2.5.8"

