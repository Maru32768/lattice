[package]
name = "lattice-core"
version = "0.1.0"
edition = "2024"

[dependencies]
dom_query = "0.28.0"
dom_smoothie = "0.18.2"
encoding_rs = "0.8.42"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "gzip", "brotli", "deflate", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
